<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Staff Kitchen Queue</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="stylesheet" href="/static/css/style.css">
    <style>
        .q-wrap { max-width: 1100px; margin: 0 auto; padding: 1.5rem 1rem; }
        .q-head { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1rem; }
        .q-filters { display: flex; flex-wrap: wrap; gap: .5rem; margin-bottom: 1.25rem; }
        .q-filter { padding: .45rem .9rem; border-radius: 999px; border: 1px solid rgba(255,255,255,.2); background: rgba(255,255,255,.05); color: inherit; cursor: pointer; font: inherit; }
        .q-filter.active { background: #f59e0b; color: #111; border-color: #f59e0b; }
        .q-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 1rem; }
        .q-card { padding: 1rem; border-radius: 14px; border: 1px solid rgba(255,255,255,.15); background: rgba(255,255,255,.06); }
        .q-top { display: flex; justify-content: space-between; align-items: center; margin-bottom: .5rem; }
        .q-id { font-weight: 700; font-size: 1.1rem; }
        .q-status { padding: .2rem .7rem; border-radius: 999px; font-size: .8rem; font-weight: 600; color: #111; }
        .st-Pending { background: #fbbf24; } .st-Preparing { background: #38bdf8; }
        .st-Ready { background: #4ade80; } .st-Completed { background: #94a3b8; }
        .q-items { margin: .6rem 0; padding: 0; list-style: none; }
        .q-items li { padding: .3rem 0; border-bottom: 1px dashed rgba(255,255,255,.12); }
        .q-addon { font-size: .8rem; opacity: .75; display: block; }
        .q-note { font-size: .85rem; margin: .5rem 0; color: #fbbf24; }
        .q-foot { display: flex; justify-content: space-between; align-items: center; margin-top: .75rem; gap: .5rem; }
        .q-empty { text-align: center; padding: 3rem 1rem; opacity: .7; }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="/" class="brand-logo">
                <div class="logo-icon"><i class="fa-solid fa-bolt-lightning"></i></div>
                <div class="logo-text">
                    <span class="brand-name">AURA CAFE</span>
                    <span class="brand-tag">GROQ AI POS</span>
                </div>
            </a>
            <div class="nav-links">
                <a href="/" class="nav-link" id="nav-customer-link"><i class="fa-solid fa-utensils"></i> Customer Order</a>
                <a href="/staff" class="nav-link active" id="nav-staff-link">
                    <i class="fa-solid fa-bell-concierge"></i> Staff Queue
                    <span class="badge badge-pulse" id="nav-queue-badge" style="display: none;">0</span>
                </a>
            </div>
            <div class="nav-status">
                <span class="status-indicator online"></span>
                <span class="status-label">Groq Llama 3.3 Engine</span>
            </div>
        </div>
    </nav>

    <main class="app-main">
        <div class="q-wrap">
            <div class="q-head">
                <h1 style="margin:0;"><i class="fa-solid fa-kitchen-set"></i> Kitchen Queue</h1>
                <span id="q-updated" style="opacity:.7;font-size:.85rem;">Loading...</span>
            </div>
            <div class="q-filters" id="q-filters"></div>
            <div id="q-grid" class="q-grid"></div>
        </div>
    </main>

    <script>
        const STATUSES = ["Pending", "Preparing", "Ready", "Completed"];
        const NEXT_LABEL = { Pending: "Start Preparing", Preparing: "Mark Ready", Ready: "Complete Order" };
        const FILTERS = ["Active", "Pending", "Preparing", "Ready", "Completed", "All"];
        let allOrders = [];
        let currentFilter = "Active";

        function esc(s) {
            return String(s == null ? "" : s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
        }

        async function loadOrders() {
            try {
                const res = await fetch("/api/orders?status=all");
                const data = await res.json();
                if (!data.success) return;
                allOrders = data.orders || [];
                render();
                document.getElementById("q-updated").textContent = "Updated " + new Date().toLocaleTimeString();
            } catch (err) {
                console.error("Failed to load orders:", err);
            }
        }

        function countFor(f) {
            if (f === "All") return allOrders.length;
            if (f === "Active") return allOrders.filter(o => o.status !== "Completed").length;
            return allOrders.filter(o => o.status === f).length;
        }

        function render() {
            const bar = document.getElementById("q-filters");
            bar.innerHTML = FILTERS.map(f =>
                `<button type="button" class="q-filter ${f === currentFilter ? "active" : ""}" onclick="setFilter('${f}')">${f} (${countFor(f)})</button>`
            ).join("");

            const waiting = allOrders.filter(o => o.status === "Pending" || o.status === "Preparing").length;
            const badge = document.getElementById("nav-queue-badge");
            badge.textContent = waiting;
            badge.style.display = waiting > 0 ? "inline-block" : "none";

            let list = allOrders;
            if (currentFilter === "Active") list = allOrders.filter(o => o.status !== "Completed");
            else if (currentFilter !== "All") list = allOrders.filter(o => o.status === currentFilter);

            const grid = document.getElementById("q-grid");
            if (list.length === 0) {
                grid.innerHTML = `<div class="q-empty"><i class="fa-solid fa-mug-hot fa-2x"></i><p>No orders here yet.</p></div>`;
                return;
            }
            grid.innerHTML = list.map(cardHtml).join("");
        }

        function cardHtml(o) {
            const p = o.parsed_data || {};
            const items = (p.items || []).map(it => {
                const addons = (it.add_ons || []).length ? `<span class="q-addon">+ ${it.add_ons.map(esc).join(", ")}</span>` : "";
                return `<li><strong>${esc(it.item)}</strong> <small>(${esc(it.size || "Standard")})</small>${addons}</li>`;
            }).join("");
            const note = p.special_instructions && p.special_instructions !== "None"
                ? `<div class="q-note"><i class="fa-solid fa-note-sticky"></i> ${esc(p.special_instructions)}</div>` : "";
            const next = NEXT_LABEL[o.status];
            const btn = next
                ? `<button type="button" class="btn btn-primary btn-sm" onclick="advance('${esc(o.id)}', '${esc(o.status)}')">${next}</button>` : "";
            const total = p.total_price != null ? "$" + parseFloat(p.total_price).toFixed(2) : "";
            return `
                <div class="q-card">
                    <div class="q-top">
                        <span class="q-id">${esc(o.id)}</span>
                        <span class="q-status st-${esc(o.status)}">${esc(o.status)}</span>
                    </div>
                    <div><i class="fa-solid fa-user"></i> ${esc(o.customer_name)}</div>
                    <ul class="q-items">${items}</ul>
                    ${note}
                    <div class="q-foot">
                        <span><i class="fa-solid fa-stopwatch"></i> ${esc(p.prep_time_display || "")} ${total ? " &bull; " + total : ""}</span>
                        ${btn}
                    </div>
                </div>`;
        }

        function setFilter(f) { currentFilter = f; render(); }

        async function advance(id, status) {
            const idx = STATUSES.indexOf(status);
            if (idx < 0 || idx >= STATUSES.length - 1) return;
            try {
                const res = await fetch("/api/orders/" + encodeURIComponent(id) + "/status", {
                    method: "PATCH",
                    headers: { "Content-Type": "application/json" },
                    body: JSON.stringify({ status: STATUSES[idx + 1] })
                });
                const data = await res.json();
                if (!data.success) alert(data.error || "Could not update the order.");
                loadOrders();
            } catch (err) {
                console.error(err);
            }
        }

        loadOrders();
        setInterval(loadOrders, 5000);
    </script>
</body>
</html>
